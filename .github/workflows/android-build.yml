name: Hermes Agent Android CI & APK Build

on:
  push:
    branches: [ "gemini/hermes-evolution-android", "main" ]
  pull_request:
    branches: [ "gemini/hermes-evolution-android", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Authentic Hermes Agent ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Hermes Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        working-directory: apps/android
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Build Android Debug APK (ARM64)
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output and Generate Checksum
        working-directory: apps/android
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found built APK: $APK_PATH"
            sha256sum "$APK_PATH" > "$APK_PATH.sha256"
            cat "$APK_PATH.sha256"
          else
            echo "Error: APK output not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-android-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/debug/*.sha256
          retention-days: 30
